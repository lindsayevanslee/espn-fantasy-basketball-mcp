repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff-check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: true
        
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        files: ^espn_fantasy_basketball_mcp/
        require_serial: true
        
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        types: [python]
        require_serial: true
        pass_filenames: false