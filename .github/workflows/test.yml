name: Tests

on:
  push:
  pull_request:
    branches: [ main ]

# The job only reads the repository; it never writes back to it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "0.11.32"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies (from lockfile)
      run: uv sync --locked --all-extras --dev

    - name: Lint
      run: uv run ruff check .

    - name: Check formatting
      run: uv run ruff format --check .

    - name: Type check
      run: uv run mypy espn_fantasy_basketball_mcp/ espn_fantasy_basketball.py

    - name: Run tests with coverage
      run: uv run pytest --cov=espn_fantasy_basketball_mcp --cov-report=term-missing
